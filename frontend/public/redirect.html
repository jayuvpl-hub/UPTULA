<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to Uptula...</title>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isMobile = /android|iphone|ipad|mobile/i.test(ua);
      var playStore = 'https://play.google.com/store/apps/details?id=com.uptula';
      var jobsUrl = 'https://uptula.com/jobs';
      window.location.replace(isMobile ? playStore : jobsUrl);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=https://uptula.com/jobs" />
</head>
<body>
  <p style="text-align:center;font-family:Arial,sans-serif;margin-top:48px;color:#334155;">
    Redirecting you to Uptula...
  </p>
  <p style="text-align:center;font-family:Arial,sans-serif;">
    <a href="https://uptula.com/jobs">Click here if you are not redirected</a>
  </p>
</body>
</html>
